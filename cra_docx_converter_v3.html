<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRA DOCX Converter</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  background-color: #1a3a4f;
  background-attachment: fixed;
  background-image:
    radial-gradient(ellipse 160% 130% at -10% -10%, rgba(80,140,200,0.50) 0%, rgba(80,140,200,0.18) 35%, rgba(80,140,200,0.04) 60%, transparent 80%),
    radial-gradient(ellipse 60% 50% at 15% 50%, rgba(50,100,160,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 120% 80% at 50% 110%, rgba(60,130,180,0.18) 0%, rgba(40,100,150,0.07) 45%, transparent 70%);
}
.card {
  background: rgba(255,255,255,0.10);
  backdrop-filter: blur(32px);
  -webkit-backdrop-filter: blur(32px);
  border-radius: 18px;
  border: 1px solid rgba(255,255,255,0.18);
  padding: 2.4rem 2.8rem;
  width: 100%;
  max-width: 520px;
}
.header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 2rem;
  padding-bottom: 1.4rem;
  border-bottom: 1px solid rgba(255,255,255,0.12);
}
.header h1 { flex: 1; }
.logo-mark {
  width: 48px; height: 48px;
  background: rgba(255,255,255,0.15);
  border-radius: 11px;
  border: 1px solid rgba(255,255,255,0.25);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.logo-mark svg { width: 28px; height: 28px; fill: rgba(255,255,255,0.90); }
.header h1 {
  font-size: 22px; font-weight: 600;
  color: rgba(255,255,255,0.95);
  letter-spacing: -0.01em;
}
.drop-zone {
  border: 1.5px dashed rgba(255,255,255,0.25);
  border-radius: 12px;
  padding: 2rem 1.5rem;
  text-align: center;
  cursor: pointer;
  transition: all 0.18s ease;
  background: rgba(255,255,255,0.06);
  margin-bottom: 1.2rem;
}
.drop-zone:hover, .drop-zone.drag-over {
  border-color: rgba(255,255,255,0.55);
  background: rgba(255,255,255,0.12);
}
.drop-icon { font-size: 40px; margin-bottom: 10px; }
.drop-zone p { font-size: 19px; color: rgba(255,255,255,0.65); line-height: 1.6; }
.drop-zone strong { color: rgba(255,255,255,0.90); }
.drop-zone .hint { font-size: 17px; color: rgba(255,255,255,0.40); margin-top: 5px; }
#file-input { display: none; }
.filename-tag {
  display: none;
  align-items: center; gap: 7px;
  background: rgba(255,255,255,0.12);
  border-radius: 7px;
  padding: 6px 13px;
  font-size: 18px; color: rgba(255,255,255,0.85);
  margin-bottom: 1.2rem;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.status-box {
  border-radius: 9px;
  padding: 13px 17px;
  font-size: 19px;
  margin-bottom: 1.2rem;
  display: none;
  line-height: 1.5;
}
.status-box.info    { background: rgba(255,255,255,0.10); color: rgba(255,255,255,0.80); }
.status-box.error   { background: rgba(180,40,40,0.25);  color: rgba(255,180,180,0.95); border: 1px solid rgba(255,100,100,0.25); }
.status-box.success { background: rgba(40,160,100,0.20); color: rgba(160,240,200,0.95); border: 1px solid rgba(60,200,120,0.25); }
.progress {
  height: 3px; background: rgba(255,255,255,0.12); border-radius: 2px;
  margin-bottom: 1.2rem; overflow: hidden; display: none;
}
.progress-bar {
  height: 100%; background: rgba(255,255,255,0.70); border-radius: 2px;
  animation: prog 1.2s ease-in-out infinite alternate;
}
@keyframes prog { from { width: 15%; } to { width: 80%; } }
.btn {
  display: block; width: 100%;
  padding: 15px;
  border-radius: 10px;
  font-size: 21px; font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
  border: none;
  margin-bottom: 10px;
}
.btn-primary {
  background: rgba(255,255,255,0.88);
  color: #1a3a4f;
}
.btn-primary:hover:not(:disabled) { background: #fff; transform: translateY(-1px); }
.btn-primary:disabled { background: rgba(255,255,255,0.18); color: rgba(255,255,255,0.30); cursor: not-allowed; }
.btn-secondary {
  background: rgba(255,255,255,0.10);
  color: rgba(255,255,255,0.80);
  border: 1px solid rgba(255,255,255,0.20);
}
.btn-secondary:hover:not(:disabled) { background: rgba(255,255,255,0.18); color: #fff; }
.btn-secondary:disabled { opacity: 0.35; cursor: not-allowed; }

.btn-reset {
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.65);
  border: 1px solid rgba(255,255,255,0.20);
  border-radius: 999px;
  padding: 9px 24px;
  font-size: 17px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  letter-spacing: 0.02em;
  transition: all 0.15s;
}
.btn-reset:hover { background: rgba(255,255,255,0.16); color: rgba(255,255,255,0.90); }
</style>
</head>
<body>

<div id="reload-prompt" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:rgba(245,243,238,0.97);border-radius:22px;padding:36px 44px;max-width:480px;width:90%;box-shadow:0 8px 40px rgba(0,0,0,0.25);text-align:center;">
    <p style="font-size:15px;font-weight:600;color:#1a1814;margin-bottom:10px;">Ready to start over</p>
    <p style="font-size:13px;color:#5a5548;margin-bottom:28px;line-height:1.7;">Please refresh the page to convert a new file.<br>Your current session has been cleared.</p>
    <div style="display:flex;gap:12px;justify-content:center;">
      <button onclick="location.reload()" style="background:#1a3a4f;color:#fff;border:none;border-radius:999px;padding:12px 36px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;">↻ Refresh Now</button>
      <button onclick="cancelReset()" style="background:rgba(0,0,0,0.08);color:#1a1814;border:none;border-radius:999px;padding:12px 24px;font-size:13px;cursor:pointer;white-space:nowrap;">Cancel</button>
    </div>
  </div>
</div>

<div class="card">
  <div class="header">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 1.5L18.5 9H13V3.5zM6 20V4h5v7h7v9H6z"/>
      </svg>
    </div>
    <h1>CRA DOCX Converter</h1>
  </div>

  <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
    <div class="drop-icon">📄</div>
    <p><strong>Click to select</strong> or drag & drop an MD file</p>
    <p class="hint">.md · .txt · Max 5MB</p>
  </div>
  <input type="file" id="file-input" accept=".md,.txt">

  <div class="filename-tag" id="filename-tag">
    <span>📎</span><span id="filename-label"></span>
  </div>

  <div class="status-box" id="status-box"></div>
  <div class="progress" id="progress"><div class="progress-bar"></div></div>

  <button class="btn btn-primary" id="btn-convert" disabled onclick="convertToDocx()">Convert to DOCX</button>
  <button class="btn btn-secondary" id="btn-download" disabled onclick="downloadDocx()">⬇ Download DOCX</button>
  <div id="btn-reset-wrap" style="display:none; text-align:center; margin-top:14px;">
    <button class="btn-reset" id="btn-reset" onclick="resetAll()">↩ Reset</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const FONT='Malgun Gothic',FONT_CS='Lao UI',BLUE='1F4E79',LGRAY='F2F2F2';
const PW=11906,PH=16838,MG=1418;
let mdText='',mdFilename='',docxBlob=null;
const hyperlinkMap=new Map();let hyperlinkCounter=5;
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function stripEmoji(s){return s.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE00}-\u{FE0F}\u{200D}]+\s*/gu,'').trim();}
function fontAttrs(){return `w:ascii="${FONT}" w:eastAsia="${FONT}" w:hAnsi="${FONT}" w:cs="${FONT_CS}"`;}
function hyperlinkId(url){if(!hyperlinkMap.has(url))hyperlinkMap.set(url,`rHyp${hyperlinkCounter++}`);return hyperlinkMap.get(url);}
const LABEL_STYLES={'FACT':{bg:'1F4E79',fg:'FFFFFF'},'INTERPRETATION':{bg:'BF8F00',fg:'FFFFFF'},'CONFLICT':{bg:'C00000',fg:'FFFFFF'},'UNVERIFIED':{bg:'C00000',fg:'FFFFFF'},'UPDATED':{bg:'375623',fg:'FFFFFF'}};
function badgeRun(label){const key=label.startsWith('DATED')?'DATED':label;const s=LABEL_STYLES[key]||{bg:'595959',fg:'FFFFFF'};return `<w:r><w:rPr><w:rFonts ${fontAttrs()}/><w:sz w:val="18"/><w:szCs w:val="18"/><w:b/><w:color w:val="${s.fg}"/><w:shd w:val="clear" w:color="auto" w:fill="${s.bg}"/></w:rPr><w:t xml:space="preserve"> [${esc(label)}] </w:t></w:r>`;}
function run(text,bold,italic,color,sz){const size=sz||22;let rpr=`<w:rPr><w:rFonts ${fontAttrs()}/><w:sz w:val="${size}"/><w:szCs w:val="${size}"/>`;if(bold)rpr+='<w:b/>';if(italic)rpr+='<w:i/>';if(color)rpr+=`<w:color w:val="${color}"/>`;rpr+='</w:rPr>';return `<w:r>${rpr}<w:t xml:space="preserve">${esc(text)}</w:t></w:r>`;}
function parseInline(text){if(!text)return'';const TOKEN_RE=/\*{0,2}\[(FACT|INTERPRETATION|CONFLICT|UNVERIFIED|UPDATED|DATED:[^\]]*?)\]\*{0,2}|\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g;const parts=[];let last=0,m;while((m=TOKEN_RE.exec(text))!==null){if(m.index>last)parts.push({type:'text',val:text.slice(last,m.index)});if(m[1]!==undefined)parts.push({type:'badge',val:m[1]});else parts.push({type:'link',label:m[2],url:m[3]});last=m.index+m[0].length;}if(last<text.length)parts.push({type:'text',val:text.slice(last)});if(!parts.length)return run(text,false,false,null);let out='';for(const p of parts){if(p.type==='badge'){out+=badgeRun(p.val);}else if(p.type==='link'){const rId=hyperlinkId(p.url);out+=`<w:hyperlink r:id="${rId}" w:history="1"><w:r><w:rPr><w:rStyle w:val="Hyperlink"/></w:rPr><w:t xml:space="preserve">${esc(p.label)}</w:t></w:r></w:hyperlink>`;}else{const re2=/\*\*(.+?)\*\*|\*(.+?)\*|([^*]+)/g;let m2;while((m2=re2.exec(p.val))!==null){if(!m2[0])break;if(m2[1]!==undefined)out+=run(m2[1],true,false,null);else if(m2[2]!==undefined)out+=run(m2[2],false,true,null);else if(m2[3]!==undefined)out+=run(m2[3],false,false,null);}}}return out||run(text,false,false,null);}
function heading(text,level){const sizes={1:'32',2:'26',3:'24',4:'22'};const before={1:'0',2:'260',3:'200',4:'160'};const after={1:'0',2:'120',3:'80',4:'60'};const sz=sizes[level]||'22';if(level===1){const sep=text.indexOf(' | ');const title=sep>=0?text.slice(0,sep).trim():text.trim();const date=sep>=0?text.slice(sep+3).trim():null;const titleP=`<w:p><w:pPr><w:pStyle w:val="Heading1"/><w:jc w:val="center"/><w:spacing w:before="0" w:after="0"/></w:pPr><w:r><w:rPr><w:rFonts ${fontAttrs()}/><w:b/><w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/><w:color w:val="${BLUE}"/></w:rPr><w:t>${esc(stripEmoji(title))}</w:t></w:r></w:p>`;if(!date)return titleP;const dateP=`<w:p><w:pPr><w:pStyle w:val="Heading1"/><w:jc w:val="right"/><w:spacing w:before="0" w:after="0"/></w:pPr><w:r><w:rPr><w:rFonts ${fontAttrs()}/><w:b w:val="0"/><w:sz w:val="24"/><w:szCs w:val="24"/><w:color w:val="${BLUE}"/></w:rPr><w:t>${esc(date)}</w:t></w:r></w:p>`;return titleP+dateP;}const clean=stripEmoji(text);return `<w:p><w:pPr><w:pStyle w:val="Heading${level}"/><w:spacing w:before="${before[level]}" w:after="${after[level]}"/></w:pPr><w:r><w:rPr><w:rFonts ${fontAttrs()}/><w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/><w:color w:val="${BLUE}"/></w:rPr><w:t>${esc(clean)}</w:t></w:r></w:p>`;}
function blockquote(text,depth){const indent=360*depth;return `<w:p><w:pPr><w:ind w:left="${indent+360}"/><w:jc w:val="both"/><w:pBdr><w:left w:val="single" w:sz="12" w:space="5" w:color="3DAB8E"/></w:pBdr></w:pPr>${parseInline(text)}</w:p>`;}
function tableRow(cells,isHeader,fill){const bg=isHeader?BLUE:(fill||'FFFFFF');const tc=isHeader?'FFFFFF':'000000';const colW=Math.floor(8640/Math.max(cells.length,1));const cellXml=cells.map(c=>`<w:tc><w:tcPr><w:tcW w:w="${colW}" w:type="dxa"/><w:shd w:val="clear" w:color="auto" w:fill="${bg}"/><w:tcMar><w:top w:w="80" w:type="dxa"/><w:bottom w:w="80" w:type="dxa"/><w:left w:w="120" w:type="dxa"/><w:right w:w="120" w:type="dxa"/></w:tcMar></w:tcPr><w:p><w:pPr><w:jc w:val="both"/></w:pPr><w:r><w:rPr><w:rFonts ${fontAttrs()}/><w:sz w:val="20"/><w:szCs w:val="20"/>${isHeader?'<w:b/>':''}<w:color w:val="${tc}"/></w:rPr><w:t xml:space="preserve">${esc(c||'')}</w:t></w:r></w:p></w:tc>`).join('');return `<w:tr>${cellXml}</w:tr>`;}
function flushTable(th,tb){if(!th.length&&!tb.length)return'';let t=`<w:tbl><w:tblPr><w:tblW w:w="8640" w:type="dxa"/><w:tblBorders>${['top','bottom','left','right','insideH','insideV'].map(s=>`<w:${s} w:val="single" w:sz="2" w:color="CCCCCC"/>`).join('')}</w:tblBorders></w:tblPr>`;if(th.length)t+=tableRow(th,true,null);tb.forEach((row,ri)=>{t+=tableRow(row,false,ri%2===0?'FFFFFF':LGRAY);});return t+`</w:tbl><w:p/>`;}
// 동적 numbering — abstractNum + num 쌍을 섹션마다 독립 생성
// Word는 같은 abstractNumId 공유시 번호를 이어가므로 둘 다 분리해야 함
let _decimalGroups = []; // {abstractNumId, numId} 쌍 목록
let _nextAbstractNumId = 1; // 0은 bullet 고정
let _nextNumId = 2;         // 1은 bullet 고정

function newDecimalNumId() {
  const abstractId = _nextAbstractNumId++;
  const numId = _nextNumId++;
  _decimalGroups.push({abstractNumId: abstractId, numId});
  return numId;
}

function buildBodyXml(md){
  hyperlinkMap.clear();hyperlinkCounter=5;
  _decimalGroups=[];_nextAbstractNumId=1;_nextNumId=2; // 매 변환마다 초기화
  const lines=md.split('\n');
  let bodyXml='',inTable=false,tableHeaders=[],tableBodyRows=[],lastWasBlank=false,inSources=false;
  let inOrderedList=false, currentDecimalNumId=null; // ordered list 추적
  let inBulletList=false; // bullet list 추적 (리셋용)

  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    if(line.trim().startsWith('|')){const cells=line.split('|').map(c=>c.trim()).filter((_,idx,a)=>idx>0&&idx<a.length-1);if(cells.every(c=>/^[-:\s]+$/.test(c))){inTable=true;continue;}if(!inTable){tableHeaders=cells;inTable=true;continue;}tableBodyRows.push(cells);lastWasBlank=false;continue;}else if(inTable){bodyXml+=flushTable(tableHeaders,tableBodyRows);tableHeaders=[];tableBodyRows=[];inTable=false;}
    if(/^---+$/.test(line.trim()))continue;
    if(line.trim().startsWith('*CRA '))continue;
    if(!line.trim()){
      let nextReal='';for(let j=i+1;j<lines.length;j++){const nl=lines[j].trim();if(!nl)continue;if(/^---+$/.test(nl)||nl.startsWith('*CRA '))continue;nextReal=nl;break;}
      let prevReal='';for(let j=i-1;j>=0;j--){const pl=lines[j].trim();if(!pl)continue;if(/^---+$/.test(pl)||pl.startsWith('*CRA '))continue;prevReal=pl;break;}
      // 다음 실제 줄이 numbered list가 아닐 때만 그룹 종료
      if(!/^\d+\. /.test(nextReal)){inOrderedList=false;currentDecimalNumId=null;}
      inBulletList=false;
      const afterH1=prevReal.startsWith('# '),beforeH2=nextReal.startsWith('## '),beforeBQ=nextReal.startsWith('>'),atEnd=!nextReal;
      if((beforeH2||beforeBQ||atEnd)&&!afterH1&&!lastWasBlank){bodyXml+='<w:p/>';lastWasBlank=true;}
      continue;
    }
    lastWasBlank=false;
    if(line.startsWith('# ')){inSources=false;inOrderedList=false;currentDecimalNumId=null;inBulletList=false;bodyXml+=heading(line.slice(2),1);continue;}
    if(line.startsWith('## ')){const h2=stripEmoji(line.slice(3).trim());inSources=/^(sources|출처)$/i.test(h2);inOrderedList=false;currentDecimalNumId=null;inBulletList=false;bodyXml+=heading(line.slice(3),2);continue;}
    if(line.startsWith('### ')){inSources=false;inOrderedList=false;currentDecimalNumId=null;inBulletList=false;bodyXml+=heading(line.slice(4),3);continue;}
    if(line.startsWith('#### ')){inSources=false;inOrderedList=false;currentDecimalNumId=null;inBulletList=false;bodyXml+=heading(line.slice(5),4);continue;}
    const bqMatch=line.match(/^(>+)\s*(.*)/);
    if(bqMatch){inOrderedList=false;currentDecimalNumId=null;inBulletList=false;bodyXml+=blockquote(bqMatch[2],bqMatch[1].length);continue;}
    if(/^- \[x\] /i.test(line)){inOrderedList=false;currentDecimalNumId=null;inBulletList=false;bodyXml+=`<w:p><w:pPr><w:ind w:left="360" w:hanging="240"/><w:jc w:val="both"/></w:pPr>${run('☑ ',false,false,'2d7a5f')}${run(line.slice(6),false,false,'888888')}</w:p>`;continue;}
    if(/^- \[ \] /.test(line)){inOrderedList=false;currentDecimalNumId=null;inBulletList=false;bodyXml+=`<w:p><w:pPr><w:ind w:left="360" w:hanging="240"/><w:jc w:val="both"/></w:pPr>${run('☐ ',false,false,null)}${parseInline(line.slice(6))}</w:p>`;continue;}
    if(/^- /.test(line)){
      inOrderedList=false;currentDecimalNumId=null;
      const jc=inSources?'left':'both';
      bodyXml+=`<w:p><w:pPr><w:numPr><w:ilvl w:val="0"/><w:numId w:val="1"/></w:numPr><w:ind w:left="426" w:hanging="284"/><w:jc w:val="${jc}"/></w:pPr>${parseInline(line.slice(2))}</w:p>`;
      continue;
    }
    if(/^\d+\. /.test(line)){
      // ordered list: 새 그룹이면 새 numId 발급
      if(!inOrderedList){
        currentDecimalNumId=newDecimalNumId();
        inOrderedList=true;
      }
      const jc=inSources?'left':'both';
      bodyXml+=`<w:p><w:pPr><w:numPr><w:ilvl w:val="0"/><w:numId w:val="${currentDecimalNumId}"/></w:numPr><w:ind w:left="426" w:hanging="284"/><w:jc w:val="${jc}"/></w:pPr>${parseInline(line.replace(/^\d+\. /,''))}</w:p>`;
      continue;
    }
    inOrderedList=false;currentDecimalNumId=null;
    bodyXml+=`<w:p><w:pPr><w:jc w:val="both"/></w:pPr>${parseInline(line)}</w:p>`;
  }
  if(inTable)bodyXml+=flushTable(tableHeaders,tableBodyRows);
  return bodyXml;
}
async function buildDocx(md){const bodyXml=buildBodyXml(md);const HYPREL='http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink';const hyperlinkRels=Array.from(hyperlinkMap.entries()).map(([url,rId])=>`<Relationship Id="${rId}" Type="${HYPREL}" Target="${esc(url)}" TargetMode="External"/>`).join('');const footerPage=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:ftr xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:p><w:pPr><w:pStyle w:val="Footer"/><w:framePr w:wrap="none" w:vAnchor="text" w:hAnchor="margin" w:xAlign="center" w:y="1"/></w:pPr><w:r><w:fldChar w:fldCharType="begin"/></w:r><w:r><w:instrText xml:space="preserve"> PAGE </w:instrText></w:r><w:r><w:fldChar w:fldCharType="separate"/></w:r><w:r><w:fldChar w:fldCharType="end"/></w:r></w:p></w:ftr>`;const footerEmpty=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:ftr xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:p><w:pPr><w:pStyle w:val="Footer"/></w:pPr></w:p></w:ftr>`;const docXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>${bodyXml}<w:sectPr><w:footerReference w:type="default" r:id="rId3"/><w:footerReference w:type="even" r:id="rId4"/><w:pgSz w:w="${PW}" w:h="${PH}"/><w:pgMar w:top="${MG}" w:right="${MG}" w:bottom="${MG}" w:left="${MG}" w:header="709" w:footer="709" w:gutter="0"/></w:sectPr></w:body></w:document>`;const stylesXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts ${fontAttrs()}/><w:sz w:val="22"/><w:szCs w:val="22"/></w:rPr></w:rPrDefault></w:docDefaults><w:style w:type="paragraph" w:styleId="Normal"><w:name w:val="Normal"/><w:pPr><w:jc w:val="both"/><w:spacing w:line="280" w:lineRule="auto"/></w:pPr><w:rPr><w:rFonts ${fontAttrs()}/><w:sz w:val="22"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Footer"><w:name w:val="footer"/><w:basedOn w:val="Normal"/><w:pPr><w:jc w:val="center"/></w:pPr><w:rPr><w:rFonts ${fontAttrs()}/><w:sz w:val="18"/><w:szCs w:val="18"/></w:rPr></w:style>${[1,2,3,4].map(n=>{const sz=['32','26','24','22'][n-1];const bef=['0','260','200','160'][n-1];const aft=['0','120','80','60'][n-1];const bold=n===1?'':'<w:b/>';return `<w:style w:type="paragraph" w:styleId="Heading${n}"><w:name w:val="heading ${n}"/><w:basedOn w:val="Normal"/><w:pPr><w:outlineLvl w:val="${n-1}"/><w:spacing w:before="${bef}" w:after="${aft}"/></w:pPr><w:rPr><w:rFonts ${fontAttrs()}/>${bold}<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/><w:color w:val="${BLUE}"/></w:rPr></w:style>`;}).join('')}<w:style w:type="character" w:styleId="Hyperlink"><w:name w:val="Hyperlink"/><w:rPr><w:color w:val="0563C1"/><w:u w:val="single"/></w:rPr></w:style></w:styles>`;// 동적 abstractNum + num 쌍을 numbering.xml에 추가
const dynamicAbstracts = _decimalGroups.map(g =>
  `<w:abstractNum w:abstractNumId="${g.abstractNumId}"><w:lvl w:ilvl="0"><w:start w:val="1"/><w:numFmt w:val="decimal"/><w:lvlText w:val="%1."/><w:lvlJc w:val="left"/><w:pPr><w:ind w:left="426" w:hanging="284"/></w:pPr></w:lvl></w:abstractNum>`
).join('');
const dynamicNums = _decimalGroups.map(g =>
  `<w:num w:numId="${g.numId}"><w:abstractNumId w:val="${g.abstractNumId}"/></w:num>`
).join('');
const numXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:numbering xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:abstractNum w:abstractNumId="0"><w:lvl w:ilvl="0"><w:start w:val="1"/><w:numFmt w:val="bullet"/><w:lvlText w:val="•"/><w:lvlJc w:val="left"/><w:pPr><w:ind w:left="426" w:hanging="284"/></w:pPr><w:rPr><w:rFonts w:ascii="Symbol" w:hAnsi="Symbol"/></w:rPr></w:lvl></w:abstractNum>${dynamicAbstracts}<w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num>${dynamicNums}</w:numbering>`;const relsXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/><Relationship Id="rId4" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer2.xml"/>${hyperlinkRels}</Relationships>`;const appRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;const ct=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/><Override PartName="/word/footer2.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/></Types>`;const zip=new JSZip();zip.file('[Content_Types].xml',ct);zip.file('_rels/.rels',appRels);zip.file('word/document.xml',docXml);zip.file('word/styles.xml',stylesXml);zip.file('word/numbering.xml',numXml);zip.file('word/_rels/document.xml.rels',relsXml);zip.file('word/footer1.xml',footerPage);zip.file('word/footer2.xml',footerEmpty);return await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',compression:'DEFLATE',compressionOptions:{level:6}});}
function setStatus(msg,type='info'){const el=document.getElementById('status-box');el.textContent=msg;el.className='status-box '+type;el.style.display='block';}
function showProgress(show){document.getElementById('progress').style.display=show?'block':'none';}
function loadFile(file){if(!file||!file.name.match(/\.(md|txt)$/i)){setStatus('Only .md and .txt files are supported.','error');return;}const reader=new FileReader();reader.onload=e=>{mdText=e.target.result;mdFilename=file.name;document.getElementById('filename-label').textContent=mdFilename;document.getElementById('filename-tag').style.display='inline-flex';document.getElementById('btn-convert').disabled=false;document.getElementById('status-box').style.display='none';docxBlob=null;document.getElementById('btn-download').disabled=true;document.getElementById('btn-reset-wrap').style.display='block';};reader.readAsText(file);}

async function resetAll() {
  if (typeof window.storage !== 'undefined') {
    const resetAt = String(Date.now());
    try { await window.storage.set('cra_reset_at', resetAt); } catch(e) {}
  }
  const prompt = document.getElementById('reload-prompt');
  prompt.style.display = 'flex';
}

function cancelReset() {
  document.getElementById('reload-prompt').style.display = 'none';
}
document.getElementById('file-input').addEventListener('change',e=>loadFile(e.target.files[0]));
const dz=document.getElementById('drop-zone');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over');});
dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag-over');loadFile(e.dataTransfer.files[0]);});
async function convertToDocx(){if(!mdText)return;setStatus('Converting...','info');showProgress(true);document.getElementById('btn-convert').disabled=true;try{docxBlob=await buildDocx(mdText);showProgress(false);setStatus('✓ Conversion complete. Download your file using the button below.','success');document.getElementById('btn-download').disabled=false;}catch(e){showProgress(false);setStatus('Conversion failed: '+e.message,'error');document.getElementById('btn-convert').disabled=false;}}
// ── 다운로드 (브라우저 기본 다운로드 폴더로 직접 저장) ──────────────────────
async function downloadDocx() {
  if (!docxBlob) return;
  const suggestedName = mdFilename.replace(/\.(md|txt)$/i, '.docx');
  const url = URL.createObjectURL(docxBlob);
  const a = document.createElement('a');
  a.href = url; a.download = suggestedName;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  return suggestedName;
}

window.loadMarkdown=function(text,filename){mdText=text;mdFilename=filename||'document.md';document.getElementById('filename-label').textContent=mdFilename;document.getElementById('filename-tag').style.display='inline-flex';document.getElementById('btn-convert').disabled=false;document.getElementById('status-box').style.display='none';docxBlob=null;document.getElementById('btn-download').disabled=true;return'loaded: '+mdFilename;};
window.triggerConvert=async function(){if(!mdText)return'error: no markdown loaded';await convertToDocx();return docxBlob?'success':'error';};
window.triggerDownload=async function(){const result=await downloadDocx();return result||'download triggered';};
</script>
